<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Redefinir Senha - Financeiro Tribo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css?v=215">

</head>

<body class="dark-theme">
    <div id="toast-container" class="toast-container"></div>
    
    <section class="login-screen-wrapper">
        <div class="login-overlay"></div>
        <div style="position: relative; z-index: 20; display: flex; flex-direction: column; width: 100%; max-width: 420px;">
            <div class="login-card-container animate-fade-in" style="width: 100%; box-sizing: border-box;">
                <div class="login-header">
                    <img src="logo.png" alt="Financeiro Tribo" class="login-logo">
                    <h1>Nova Senha</h1>
                    <p class="login-subtitle" style="margin-top: 10px;">Crie uma nova senha de acesso.</p>
                </div>

                <form id="reset-password-form" class="login-form-premium">
                    <div class="input-group premium-input-group">
                        <label for="new-password">Nova Senha</label>
                        <div class="input-icon-wrapper password-wrapper">
                            <span class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="18" height="18" fill="currentColor"><path d="M256 160L256 224L384 224L384 160C384 124.7 355.3 96 320 96C284.7 96 256 124.7 256 160zM192 224L192 160C192 89.3 249.3 32 320 32C390.7 32 448 89.3 448 160L448 224C483.3 224 512 252.7 512 288L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 288C128 252.7 156.7 224 192 224z"/></svg>
                            </span>
                            <input type="password" id="new-password" required placeholder="Mín. 5 chars, 1 num, 1 especial">
                        </div>
                    </div>

                    <button type="submit" id="reset-submit-btn" class="btn-primary premium-submit-btn" style="margin-top: 1rem;">Redefinir Senha</button>
                    <div id="reset-error" class="error-msg premium-error-msg"></div>
                    
                    <div class="login-actions-premium" style="justify-content: center; margin-top: 20px;">
                        <a href="login.html" class="premium-forgot-link" style="text-decoration: none;">&larr; Voltar ao Login</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const errorDiv = document.getElementById('reset-error');
            const form = document.getElementById('reset-password-form');
            const submitBtn = document.getElementById('reset-submit-btn');

            if (!token) {
                errorDiv.textContent = 'Token de recuperação não encontrado na URL.';
                submitBtn.disabled = true;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                errorDiv.textContent = '';
                
                const complexityRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*()_+=\[\]{};':"\\|,.<>\/?-]).{5,}$/;
                if (!complexityRegex.test(newPassword)) {
                    errorDiv.textContent = 'A senha deve ter no mínimo 5 caracteres, 1 número e 1 caractere especial.';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Aguarde...';

                try {
                    const response = await fetch('/api/auth/reset-password-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, newPassword })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Erro ao redefinir senha');
                    }
                    
                    let countdown = 5;
                    form.innerHTML = `<div style="text-align: center; color: var(--success-color); padding: 20px 0;">
                        <strong>Sucesso!</strong><br><br>
                        ${data.message || 'Sua senha foi redefinida.'}<br><br>
                        Você será redirecionado para o login em <strong id="countdown">${countdown}</strong> segundos.
                    </div>`;

                    const interval = setInterval(() => {
                        countdown--;
                        const countdownEl = document.getElementById('countdown');
                        if (countdownEl) countdownEl.textContent = countdown;
                        
                        if (countdown <= 0) {
                            clearInterval(interval);
                            window.location.href = 'login.html';
                        }
                    }, 1000);
                } catch (err) {
                    errorDiv.textContent = err.message;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Redefinir Senha';
                }
            });
        });
    </script>
</body>
</html>
