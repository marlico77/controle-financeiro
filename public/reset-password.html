<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Redefinir Senha - Financeiro Tribo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css?v=212">
    <style>
        .reset-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--bg-color);
        }
    </style>
</head>

<body class="dark-theme">
    <div id="toast-container" class="toast-container"></div>
    
    <div class="reset-wrapper">
        <div style="position: relative; z-index: 20; display: flex; flex-direction: column; width: 100%; max-width: 420px;">
            <div class="login-card-container animate-fade-in" style="width: 100%; box-sizing: border-box;">
                <div class="login-header">
                    <img src="logo.png" alt="Financeiro Tribo" class="login-logo">
                    <h1>Nova Senha</h1>
                    <p style="color: rgba(255, 255, 255, 0.7); font-size: 0.95rem; margin-top: 10px;">Crie uma nova senha de acesso.</p>
                </div>

                <form id="reset-password-form" class="premium-form">
                    <div class="form-group premium-input-group">
                        <label for="new-password">Nova Senha</label>
                        <div style="position: relative;">
                            <input type="password" id="new-password" class="premium-input" placeholder="Mín. 5 chars, 1 num, 1 especial" required>
                        </div>
                    </div>

                    <button type="submit" id="reset-submit-btn" class="btn-primary premium-submit-btn" style="margin-top: 1rem;">Redefinir Senha</button>
                    <div id="reset-error" class="error-msg premium-error-msg"></div>
                    <div class="system-version premium-version" style="margin-top: 15px;">
                        <a href="login.html" style="color: rgba(255, 255, 255, 0.7); text-decoration: none;">&larr; Voltar ao Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const errorDiv = document.getElementById('reset-error');
            const form = document.getElementById('reset-password-form');
            const submitBtn = document.getElementById('reset-submit-btn');

            if (!token) {
                errorDiv.textContent = 'Token de recuperação não encontrado na URL.';
                submitBtn.disabled = true;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                errorDiv.textContent = '';
                
                const complexityRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*()_+\\-=\\[\\]{};':"\\\\|,.<>\\/?]).{5,}$/;
                if (!complexityRegex.test(newPassword)) {
                    errorDiv.textContent = 'A senha deve ter no mínimo 5 caracteres, 1 número e 1 caractere especial.';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Aguarde...';

                try {
                    const response = await fetch('/api/auth/reset-password-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, newPassword })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Erro ao redefinir senha');
                    }
                    
                    form.innerHTML = '<div style="text-align: center; color: var(--success-color); padding: 20px 0;"><strong>Sucesso!</strong><br><br>Sua senha foi redefinida. <a href="login.html" style="color: var(--accent-color); text-decoration: underline;">Clique aqui para fazer login</a>.</div>';
                } catch (err) {
                    errorDiv.textContent = err.message;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Redefinir Senha';
                }
            });
        });
    </script>
</body>
</html>
